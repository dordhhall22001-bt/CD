name: CD Pipeline

on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run e2e tests
        run: npm run test:e2e

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Simulate Deploy to VPS
        run: |
          echo "Connecting to VPS server at simulated IP..."
          sleep 2

          echo "Authenticating via SSH..."
          sleep 1

          echo "Logged into VPS successfully."

          echo "Logging into GHCR..."
          sleep 1
          echo "Login Succeeded"

          echo "Pulling the latest image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest..."
          sleep 3
          echo "Status: Downloaded newer image for ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          echo "Stopping existing container 'nestjs-app'..."
          sleep 1
          echo "nestjs-app"

          echo "Removing existing container 'nestjs-app'..."
          sleep 1
          echo "nestjs-app"

          echo "Starting new container..."
          sleep 2
          echo "f9b87c2b5d4e1a3b8c5d2e7f4a1b8c5d2e7f4a1b8c5d2e7f4a1b8c5d2e7f4a1b"

          echo "Deployment simulated successfully!"
